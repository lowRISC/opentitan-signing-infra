name: Create Release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag
        required: true
        type: string
      ref:
        description: Git branch or commit hash to checkout (leave blank for default branch)
        required: false
        type: string
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Necessary permission to create a release:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Create Tarball
        run: |
          git archive --format=tar.gz                                        \
            --prefix=opentitan-signing-infra-${{ inputs.release_tag }}/ HEAD \
            -o opentitan-signing-infra-${{ inputs.release_tag }}.tar.gz

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the release if it doesn't already exist
          gh release create '${{ inputs.release_tag }}'               \
            --target '${{ inputs.ref }}'                              \
            --title "${{ inputs.release_tag }}"                       \
            --notes "Stable archive for downstream Bazel consumption" \
          || echo "release already exists"

          # Add the artifacts
          gh release upload '${{ inputs.release_tag }}' \
            --clobber                                   \
            ./opentitan-signing-infra-${{ inputs.release_tag }}.tar.gz
